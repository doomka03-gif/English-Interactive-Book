name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and prepare V54
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/v54 /tmp/unpacked
          mkdir -p /tmp/v54 /tmp/unpacked app/src/main/assets
          gh release download v54 --pattern "MASTER_PROJECT_V54_USB_PORTABLE_COMPLETE.zip" --dir /tmp/v54
          unzip -q /tmp/v54/MASTER_PROJECT_V54_USB_PORTABLE_COMPLETE.zip -d /tmp/unpacked
          HTML=$(find /tmp/unpacked -type f -name "MASTER_PROJECT_V54_DRAW_AFTER_ZOOM_FIX.html" | head -n 1)
          if [ -z "$HTML" ]; then
            echo "ERROR: MASTER_PROJECT_V54_DRAW_AFTER_ZOOM_FIX.html not found"
            exit 1
          fi
          ROOT=$(dirname "$HTML")
          cp -a "$ROOT"/. app/src/main/assets/
          cp "$HTML" app/src/main/assets/index.html
          echo "V54 prepared successfully"

      - name: Build APK
        env:
          GRADLE_OPTS: "-Xmx6g -Dorg.gradle.jvmargs=-Xmx6g"
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V54-APK
          path: app/build/outputs/apk/debug/app-debug.apk
